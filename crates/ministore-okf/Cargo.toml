[package]
name = "ministore-okf"
version = "0.1.0"
edition = "2021"

[lib]
name = "ministore_okf"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
yaml-rust2 = { version = "0.11", default-features = false }

[dev-dependencies]
proptest = "1.11"
