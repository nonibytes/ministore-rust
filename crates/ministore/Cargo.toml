[package]
name = "ministore"
version = "0.1.0"
edition = "2021"

[lib]
name = "ministore"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
regex = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
